# The result screen: copy the short link, save the picture, report it.
appId: codes.qrx.app
---
- launchApp:
    stopApp: true
# a system "isn't responding" dialog on a busy CI emulator
- tapOn:
    text: Wait
    optional: true
- openLink: codes.qrx.app://code/hv8551
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Checked to scan
    timeout: 30000
- tapOn:
    text: Copy link
    index: 0
    waitToSettleTimeoutMs: 300
- assertVisible: Link copied
- tapOn:
    text: Save
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: 'Saved to .*'
    timeout: 15000
- scrollUntilVisible:
    element: Report a problem with this image
- tapOn: Report a problem with this image
- extendedWaitUntil:
    visible: Report this image
    timeout: 10000
- tapOn: Send report
- extendedWaitUntil:
    visible: Thanks, we’ve got it
    timeout: 10000
