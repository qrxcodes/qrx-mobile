name: Android

# Builds an installable APK for the development build (talks to dev.qrx.codes; release-optimised, signed with the
# debug key) and, on demand or on main, captures store screenshots of the mock build in an emulator.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Capture store screenshots
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Development APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VARIANT: development
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: false
          tool-cache: false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk qrx-dev-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v7
        with:
          name: qrx-dev-apk
          path: qrx-dev-${{ github.run_number }}.apk

  screenshots:
    name: Store screenshots (emulator)
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QRX_MOCK: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: false
          tool-cache: false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build (x86_64, for the emulator)
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/capture-android.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-android
          path: shots/android
          include-hidden-files: true
